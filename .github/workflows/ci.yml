name: CI

# Runs the full quality gate (prettier, lint, typecheck, jest) on every PR and
# on pushes to master. The jest suite mocks Prisma, so no database is needed —
# `prisma generate` only needs the schema, to produce the client types that
# typecheck and lint rely on.

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run quality gate
        run: npm test
